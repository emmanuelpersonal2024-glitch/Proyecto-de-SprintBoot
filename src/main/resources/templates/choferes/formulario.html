<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${titulo} + ' - TiendaCarros'">Chofer</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{sidebar :: sidebar}"></div>
<main class="main-content">
    <div class="page-header">
        <div class="page-title">
            <h1 th:text="'&#x1F464; ' + ${titulo}">Chofer</h1>
            <p>Completa los campos del formulario</p>
        </div>
        <a th:href="@{/choferes}" class="btn btn-outline">&#x2190; Volver</a>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form th:action="@{/choferes/guardar}" th:object="${chofer}" method="post">
                <div class="form-group">
                    <label>Cedula</label>
                    <input type="text" th:field="*{cedula_chofer}" class="form-control" placeholder="Ej: 1234567890" required/>
                </div>
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" th:field="*{nombre_completo_chofer}" class="form-control" placeholder="Ej: Juan Perez" required/>
                </div>
                <div class="form-group">
                    <label>Licencia</label>
                    <input type="text" th:field="*{licencia_chofer}" class="form-control" placeholder="Ej: C1, B2" required/>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="'&#x2713; ' + ${accion}">Guardar</button>
                    <a th:href="@{/choferes}" class="btn btn-outline">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
